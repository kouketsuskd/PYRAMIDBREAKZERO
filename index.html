 if(G.introMode){G.introMode=false;G.bullets=[];G.setState("MENU");G.say(["機械天使の長い攻撃が止んだあと、宇宙には六人の荒い呼吸だけが残った。","トシユキ「昔の俺なら、時間ごと逃げていたかもしれない。」","カズアキ「でも今は違う。ここにいる全員の明日を、俺たちは知ってしまった。」","マッピー「帰ろう。勝っても、負けてもじゃない。全員で帰るんだ。」","ケイタ「朝が来るまで、火は消さない。」","イサジ「怖いなら、怖いまま立て。俺もそうする。」","リョウゴ「未来はまだ見えない。だから、選べる。」","――長い戦いが始まった。"],()=>{G.setState("MENU");G.toast(G.current().name+"のターン",1)});return}

Game.useSkill=function(){
 const G=Game,p=G.current(),i=G.active,lim=G.skillLimit(i);
 if(i===0&&G.boss.hp>G.boss.max/2){
  G.say(["トシユキは目を閉じ、止まらない時計の音を聞いた。","トシユキ「まだだ。今の俺では、この世界までは止められない。」","アルカ・セラフの生命が半分を下回った時、その力は目を覚ます。"],()=>G.setState("MENU"));
  return;
 }
 if(G.skillUsed[i]>=lim){G.toast("この必殺技はもう使えない",1);G.setState("MENU");return}
 G.skillUsed[i]++;
 const names=["ザ・ワールド","ワールド・イズ・マイン","ピラミッド・ハート","鳳翼天翔","領域展開・鬼","虫の知らせ"];
 const quotes=["止まれ、世界。仲間の鼓動だけは進め。","この光の中では、全員の一撃が世界を斬る。","帰る場所を、ここに作る。","この命を、みんなの朝へ渡す。","守るために鬼になる。拳の数を倍にする。","見えなくても分かる。敵が動く、その一瞬前が。"];
 G.startCinematic(["clock","slash","pyramid","phoenix","oni","future"][i],names[i],quotes[i],p.c);G.setState("SKILL_CINEMA");
 setTimeout(()=>{
  G.setState("MENU");Game.restoreMusic(.8);
  const backSame=()=>{G.setState("MENU")};
  if(i===0){G.timeStopTurns=Math.max(G.timeStopTurns,6);G.say(["ついに、トシユキは時間へ手を伸ばした。","世界から音が消え、仲間の鼓動だけが静かに進み続ける。","六回の敵行動が、まだ来ない未来へ封じられた。"],backSame);return}
  if(i===1){G.critTurns=Math.max(G.critTurns,3);G.say(["カズアキの斬撃が、仲間全員の武器に残った。","三ターン、誰が攻撃しても全段クリティカルになる。"],backSame);return}
  if(i===2){G.barrierTurns=Math.max(G.barrierTurns,4);G.party.forEach((a,j)=>{if(!G.permanentDead[j]&&a.hp>0)a.hp=Math.min(a.max,a.hp+Math.ceil(a.max*.55))});G.say(["黄金のピラミッドが六人の傷を包んだ。","全員を大きく回復し、四回の敵攻撃を軽減する。"],backSame);return}
  if(i===3){
   G.party.forEach((a,j)=>{
    if(j!==i){G.permanentDead[j]=false;a.hp=a.max}
   });
   p.hp=0;G.permanentDead[i]=true;
   G.say(["鳳凰の炎が、倒れた仲間の名前を一人ずつ呼んだ。","消えかけていた鼓動が、再び宇宙に響き始める。","ケイタ「俺の分まで、生きて帰れ。」"],()=>{
    const n=G.party.findIndex((a,j)=>a.hp>0&&!G.permanentDead[j]);
    if(n>=0)G.active=n;G.setState("MENU")
   });return
  }
  if(i===4){G.oniTurns=Math.max(G.oniTurns,3);G.attackBoost[i]=2;G.say(["赤黒い領域が開き、イサジの背後に『鬼』が立った。","三回のイサジの行動で、攻撃回数が二倍になる。"],backSame);return}
  if(i===5){G.slowTurns=Math.max(G.slowTurns,5);G.say([`虫の知らせ ${G.skillUsed[i]}/1。`,`五回の敵攻撃で、弾速と予備動作が遅くなる。`],backSame);return}
 },2500);
};

const _drawCinematicFinal=Game.draw;
Game.draw=function(){
 _drawCinematicFinal();
 const G=Game,g=G.ctx;

 if((G.boss.hp<=G.boss.max/2||G.talkCount>=10)&&G.boss.hp>0){
  g.save();
  g.shadowColor="#ff3858";g.shadowBlur=14;
  G.T("ENEMY ATK ↑",48,148,11,"#ff667d","left");
  g.restore();
 }

 if(G.state==="WORLD_UNLOCK_CINEMA"&&G.worldUnlockCinema>0){
  const elapsed=3.8-G.worldUnlockCinema;
  g.save();
  g.fillStyle="rgba(0,0,8,.72)";g.fillRect(0,0,540,960);
  g.translate(270,470);
  g.shadowColor="#cdbdff";g.shadowBlur=38;
  g.strokeStyle="#d8c8ff";
  for(let i=0;i<9;i++){
   const pulse=10*Math.sin(elapsed*3+i*.7);
   g.lineWidth=i%2?3:6;
   g.beginPath();g.arc(0,0,55+i*28+pulse,0,Math.PI*2);g.stroke();
  }
  for(let i=0;i<12;i++){
   const a=i*Math.PI/6+elapsed*.22;
   g.save();g.rotate(a);g.fillStyle="#f5efff";g.fillRect(-3,-220,6,24);g.restore();
  }
  g.lineWidth=9;g.beginPath();g.moveTo(0,0);g.lineTo(0,-145);g.stroke();
  g.lineWidth=5;g.beginPath();g.moveTo(0,0);g.lineTo(105,25);g.stroke();
  g.restore();
  g.save();g.shadowColor="#000";g.shadowBlur=20;
  
  
  g.restore();
 }

 if(G.state==="BOSS_DEATH_CINEMA"&&G.deathCinema>0){
  const elapsed=4.4-G.deathCinema;
  const progress=G.clamp(elapsed/4.4,0,1);
  g.save();
  g.fillStyle=`rgba(0,0,0,${.18+progress*.45})`;g.fillRect(0,0,540,960);

  // Expanding fractures from the boss core.
  g.translate(270,205);
  g.shadowColor="#9fe8ff";g.shadowBlur=28;
  for(let i=0;i<18;i++){
   const a=i*Math.PI*2/18+i*.21;
   const len=(35+i%5*15)+progress*210;
   g.strokeStyle=i%3===0?"#ff637c":"#dff8ff";
   g.lineWidth=i%4===0?5:2;
   g.beginPath();g.moveTo(Math.cos(a)*12,Math.sin(a)*12);
   g.lineTo(Math.cos(a)*len,Math.sin(a)*len);g.stroke();
  }

  // Broken armor fragments.
  for(let i=0;i<34;i++){

  if(id===79){for(let beat=0;beat<6;beat++)for(let i=0;i<14;i++){const a=i*Math.PI*2/14+beat*.17;add(cx,cy,Math.cos(a)*(120+beat*34),Math.sin(a)*(120+beat*34),6,beat%2?"#fff":"#ffe16d","metro",{pause:.2+beat*.18,svx:Math.cos(a)*(120+beat*34),svy:Math.sin(a)*(120+beat*34)})}}
  if(id===80){G.spawnPattern(71);setTimeout(()=>G.state==="DEFENSE"&&G.spawnPattern(74),430);setTimeout(()=>G.state==="DEFENSE"&&G.spawnPattern(78),880);setTimeout(()=>G.state==="DEFENSE"&&G.spawnPattern(75),1320)}
 };

<script>
"use strict";
(function(){
 const G=Game,A=G.arena;
 G.guardItem=null;G.guardPulse=0;G.guardReflected=0;
 G.field={mode:"normal",lane:0};

 const oldReset=G.reset;
 G.reset=function(){
  G.items.mae=3;G.items.ura=3;G.items.rifle=2;G.guardItem=null;G.guardPulse=0;G.guardReflected=0;G.droneRifleReady=false;
  G.field={mode:"normal",lane:0};G.homingLasers=[];G.homingCooldown=0;G.homingChargeStart=0;G.homingCharging=false;
  oldReset();G.items.mae=3;G.items.ura=3;G.items.rifle=2;G.droneRifleReady=false;
 };

 /* 「どうぐ」を一回押した時点で、必ず三種類の一覧を開く */
 const oldChooseAction=G.chooseAction;
 G.chooseAction=function(i){
  const a=G.actions()[i];
  if(a==="どうぐ"){G.setState("ITEM_SELECT");return}
  oldChooseAction(i);
 };
 G.openItemTarget=function(){G.setState("ITEM_SELECT")};
 G.useItem=G.openItemTarget;

 G.chooseGuardItem=function(kind){
  if(G.droneRifleReady){G.toast("ポジドローンライフル装着中はバリアンを使用できない",1.65);return}
  if(G.guardItem){G.toast("バリアンはすでに装着している",1.35);return}
  if((G.items[kind]||0)<=0){G.toast(kind==="mae"?"マエバリアンはもうない":"ウラバリアンはもうない",1);return}
  G.items[kind]--;G.guardItem=kind;G.guardReflected=0;G.guardPulse=1;
  /* バリア装着後も行動可能。攻撃／はなす等を選ぶまでMENUへ戻す */
  G.setState("MENU");
  G.toast(kind==="mae"?"マエバリアン装着":"ウラバリアン装着",1.2);
 };

 const oldBegin=G.beginDefense;
 G.beginDefense=function(){
  oldBegin();
  if(G.state==="DEFENSE"){
   G.defenseTotal=G.defenseTime;
   G.field.mode="normal";
   G.field.lane=0;
   constrainHeart();
  }
 };

 const oldNext=G.nextTurn;
 G.nextTurn=function(){
  if(G.guardItem&&G.guardReflected>0)G.toast(`${G.guardReflected}発反射した！`,.8);
  G.guardItem=null;G.guardPulse=0;G.droneRifleReady=false;G.homingLasers=[];G.homingCharging=false;G.homingChargeStart=0;
  oldNext();
 };

 G.guardActive=function(){
  if(!G.guardItem||G.state!=="DEFENSE"||!G.defenseTotal)return false;
  const elapsed=G.defenseTotal-G.defenseTime;
  return G.guardItem==="mae"?elapsed<=G.defenseTotal*.5:elapsed>G.defenseTotal*.5;
 };

 const oldUB=G.updateBullets;
 G.updateBullets=function(dt){
  if(G.guardActive()){
   for(const b of G.bullets){
    if(!b||b.reflected)continue;
    const dx=b.x-G.heart.x,dy=b.y-G.heart.y,d=Math.hypot(dx,dy);
    if(d<(b.r||7)+34){
     const l=d||1,sp=Math.max(280,Math.hypot(b.vx||0,b.vy||0)*1.18);
     b.x=G.heart.x+dx/l*38;b.y=G.heart.y+dy/l*38;b.vx=dx/l*sp;b.vy=dy/l*sp;
     b.reflected=true;b.c=G.guardItem==="mae"?"#62efff":"#ff73dd";
     G.guardPulse=1;G.guardReflected++;G.damageBoss(G.boss.armor+20+Math.floor(Math.random()*80));
     G.particle(b.x,b.y,b.c,8,1);G.tone(920,.05,"square",.028,0,260);
    }
   }
  }
  oldUB(dt);
 };

 function laneBounds(){
  const pad=15;
  return {x:A.x+pad,y:A.y+pad,w:A.w-pad*2,h:A.h-pad*2};
 }
 function constrainHeart(){
  const b=laneBounds();
  G.heart.x=G.clamp(G.heart.x,b.x,b.x+b.w);
  G.heart.y=G.clamp(G.heart.y,b.y,b.y+b.h);
 }

 /* 防御中の追尾攻撃。ダメージは必ず着弾時にだけ発生する */
 G.fireHomingLaser=function(mode){
  if(G.state!=="DEFENSE"||G.homingCooldown>0)return;
  const charged=mode==="buster",rifle=mode==="rifle";
  G.homingCooldown=rifle?.85:charged?.42:.09;

   ? 65000+Math.floor(Math.random()*15001)+G.effectivePhase()*1200
   : charged
    ? 2800+Math.floor(Math.random()*501)+G.effectivePhase()*80
    : 18+Math.floor(Math.random()*18);
  const target={x:270,y:220};
  G.homingLasers.push({x:G.heart.x,y:G.heart.y,tx:target.x,ty:target.y,t:0,life:rifle?2.1:charged?1.65:1.35,trail:[],charged,rifle,hit:false,damage:dmg});
  G.tone(rifle?120:charged?380:1040,rifle?.3:charged?.16:.035,rifle?"sawtooth":charged?"sawtooth":"sine",rifle?.08:charged?.055:.018,0,rifle?980:charged?720:300);
 };

 G.useDroneRifle=function(){
  if(G.guardItem){G.toast("バリアン装着中はポジドローンライフルを装着できない",1.65);return}if(G.droneRifleReady){G.toast("ポジドローンライフルはすでに装着している",1.45);return}

  G.items.rifle--;G.droneRifleReady=true;G.setState("MENU");G.toast("ポジドローンライフル装着",1.2);
 };

 const oldUpdate=G.update;
 G.update=function(dt){

  G.guardPulse=Math.max(0,G.guardPulse-dt*2.8);G.homingCooldown=Math.max(0,G.homingCooldown-dt);

   l.t+=dt;l.life-=dt;l.trail.push({x:l.x,y:l.y});if(l.trail.length>8)l.trail.shift();
   const dx=l.tx-l.x,dy=l.ty-l.y,d=Math.hypot(dx,dy)||1;
   const speed=1250;l.x+=dx/d*speed*dt;l.y+=dy/d*speed*dt;
   if(d<(l.rifle?38:l.charged?28:24)&&!l.hit){
    l.hit=true;l.life=l.rifle?.34:l.charged?.22:.09;
    G.boss.hp=Math.max(0,G.boss.hp-l.damage);G.bossFx.hit=l.rifle?.75:l.charged?.42:.14;G.shake=Math.max(G.shake,l.rifle?24:l.charged?13:2);
    G.damageText.push({x:270+G.rnd(-20,20),y:190,n:String(l.damage),l:l.rifle?1.5:l.charged?1.05:.45,crit:!!(l.rifle||l.charged)});
    const col=l.rifle?"#ff4dff":l.charged?"#fff18a":"#72efff";
    G.particle(l.tx,l.ty,col,l.rifle?60:l.charged?34:7,l.rifle?3.2:l.charged?2.2:1);
    G.tone(l.rifle?90:l.charged?520:1320,l.rifle?.32:l.charged?.12:.04,"square",l.rifle?.09:l.charged?.045:.02,0,l.rifle?1200:-350);
    if(l.rifle){G.flash=.32;G.droneRifleReady=false}
    if(G.boss.hp<=0)G.winByFight();
   }
  }
  G.homingLasers=G.homingLasers.filter(l=>l.life>0&&!l.done);
 };

 G.openHerbTarget=function(){if(G.items.herb<=0){G.toast("やくそうはもうない",.9);return}G.setState("ITEM_TARGET")};
 function localPos(e){const r=G.canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*G.W/r.width,y:(e.clientY-r.top)*G.H/r.height}}

 /* captureで既存の「やくそうだけ」のクリック処理より先に処理する */

 },true);

  for(const b of G.bullets){b.x+=b.vx*dt*speed;b.y+=b.vy*dt*speed;if(Math.hypot(b.x-G.heart.x,b.y-G.heart.y)<b.r+G.heart.r&&G.heart.inv<=0){G.hurt(46);G.heart.inv=.7;G.shake=9}}
  const A=G.arena;G.bullets=G.bullets.filter(b=>b.x>A.x-90&&b.x<A.x+A.w+90&&b.y>A.y-90&&b.y<A.y+A.h+90).slice(-G._v53Cap);
  G.heart.x=G.clamp(G.heart.x,A.x+14,A.x+A.w-14);G.heart.y=G.clamp(G.heart.y,A.y+14,A.y+A.h-14);G.heart.inv=Math.max(0,G.heart.inv-dt);
  G.defenseTime-=dt;if(G.defenseTime<=0)G.nextTurn();
 }
 G.update=function(dt){if(isFinalDefense())return updateFinal(dt);return oldUpdate.call(G,dt)};
 G.drawBullets=function(){
  if(!isFinalDefense())return oldDrawBullets.apply(G,arguments);
  const g=G.ctx;for(const b of G.bullets){g.save();g.fillStyle=b.c||"#fff";g.shadowColor=b.c||"#fff";g.shadowBlur=b.r>=10?5:2;g.beginPath();g.arc(b.x,b.y,b.r,0,Math.PI*2);g.fill();g.restore()}
 };
 G.nextTurn=function(){G._v53Token++;if(G.boss.hp<=FINAL_HP){G.bullets=[];G.trails=[];G.particles.length=Math.min(G.particles.length,18)}return oldNext.apply(G,arguments)};
})();
